name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # nanochat.engine -> checkpoint_manager -> tokenizer does `import rustbpe` /
      # `import tiktoken` at module level, so both are required even for tests that
      # never touch a tokenizer. `kernels` is imported lazily inside
      # _load_flash_attention_3(), so it is not needed on CPU.
      - name: Install CPU-only PyTorch and test deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install filelock rustbpe tiktoken pytest

      # `python -m pytest` (not bare `pytest`) so the repo root lands on sys.path
      # and `import nanochat` works without installing the package.
      #
      # Excluded from the smoke set: test_execution.py (needs Unix `resource`),
      # test_tokenizer.py and test_tasks.py (need a trained tokenizer / datasets).
      - name: Unit tests (fast CPU subset)
        run: |
          python -m pytest tests/test_kvcache_equiv.py tests/test_engine.py \
                 tests/test_attention_fallback.py tests/test_optim.py -q
